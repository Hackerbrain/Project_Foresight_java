server:
  port: 8080

spring:
  application:
    name: project_foresight

  datasource:
    url: jdbc:h2:mem:foresightdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Google OAuth2 Credentials (can be overridden via environment variables GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-oauth2-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-oauth2-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

logging:
  level:
    com.foresight.inventory: INFO
    org.springframework.security: WARN
